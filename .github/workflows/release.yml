name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      full: true

  tag:
    name: Tag Release
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          make tag VERSION=${{ steps.semantic.outputs.new_release_git_tag }}

  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    needs: [checks, tag]
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Runs right after a tag is created on main (same workflow run, no
    # cross-workflow dispatch needed), or when a tag is pushed directly
    # (e.g. a manual `make tag`) — `checks` above is the safety net for that
    # case, since a direct tag push isn't otherwise CI-gated.
    if: |
      always() &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (
        github.ref_type == 'tag' ||
        (needs.tag.result == 'success' && needs.tag.outputs.published == 'true')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-go

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Install quill
        run: curl -sSfL https://get.anchore.io/quill | sudo sh -s -- -b /usr/local/bin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization via quill — see
          # CONTRIBUTING.md's Release process section for what these are
          # and how to rotate them.
          QUILL_SIGN_P12: ${{ secrets.QUILL_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.QUILL_SIGN_PASSWORD }}
          QUILL_NOTARY_KEY: ${{ secrets.QUILL_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.QUILL_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.QUILL_NOTARY_ISSUER }}
          # quill's default notarization poll timeout (15m) is too tight —
          # Apple's notary service can occasionally take longer, which
          # aborts the whole release. Give it more headroom.
          QUILL_STATUS_TIMEOUT_SECONDS: "1800"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/cuttings_*"
