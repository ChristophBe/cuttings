version: 2

project_name: cuttings

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    binary: cuttings
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # same variable paths as Makefile LDFLAGS
      - -X 'github.com/ChristophBe/cuttings/cmd.Version={{.Version}}'
      - -X 'github.com/ChristophBe/cuttings/cmd.BuildTime={{.Date}}'

  - id: darwin
    binary: cuttings
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # same variable paths as Makefile LDFLAGS
      - -X 'github.com/ChristophBe/cuttings/cmd.Version={{.Version}}'
      - -X 'github.com/ChristophBe/cuttings/cmd.BuildTime={{.Date}}'
    # macOS binaries are signed with a Developer ID Application certificate and
    # notarized by Apple via quill (https://github.com/anchore/quill), which
    # cross-signs from Linux CI without needing a macOS runner or Xcode. This
    # runs as a build post-hook (quill's documented integration pattern) so it
    # signs the raw binary before the archive stage packages it — the released
    # tar.gz, and therefore the Homebrew Cask, ships the signed binary.
    # `--ad-hoc` lets local/snapshot builds get a runnable signature without
    # real credentials. Credentials come from the QUILL_* env vars set in
    # .github/workflows/release.yml — see CONTRIBUTING.md's Release process
    # section. NOTE: goreleaser's generic `signs:`/`artifacts: binary` pipe
    # does NOT work here — it only matches binary artifacts when
    # `archives[].formats: binary` is set, which this project doesn't use.
    hooks:
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: cuttings
    package_name: cuttings
    formats:
      - deb
      - rpm
      - apk
    vendor: Christoph Becker
    maintainer: "Christoph Becker <post@christophb.de>"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.
    license: MIT
    bindir: /usr/bin

sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

homebrew_casks:
  - name: cuttings
    binaries:
      - cuttings
    repository:
      owner: cuttings-cli
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.

scoops:
  - repository:
      owner: cuttings-cli
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
