version: 2

project_name: cuttings

before:
  hooks:
    - go mod tidy

builds:
  - binary: cuttings
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # same variable paths as Makefile LDFLAGS
      - -X 'github.com/ChristophBe/cuttings/cmd.Version={{.Version}}'
      - -X 'github.com/ChristophBe/cuttings/cmd.BuildTime={{.Date}}'

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
