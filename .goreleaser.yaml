version: 2

project_name: cuttings

before:
  hooks:
    - go mod tidy

builds:
  - binary: cuttings
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # same variable paths as Makefile LDFLAGS
      - -X 'github.com/ChristophBe/cuttings/cmd.Version={{.Version}}'
      - -X 'github.com/ChristophBe/cuttings/cmd.BuildTime={{.Date}}'

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: cuttings
    package_name: cuttings
    formats:
      - deb
      - rpm
      - apk
    vendor: Christoph Becker
    maintainer: "Christoph Becker <post@christophb.de>"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.
    license: MIT
    bindir: /usr/bin

sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

homebrew_casks:
  - name: cuttings
    binaries:
      - cuttings
    repository:
      owner: cuttings-cli
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.

scoops:
  - repository:
      owner: cuttings-cli
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/ChristophBe/cuttings
    description: >-
      Manages git worktrees as isolated development environments.
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
