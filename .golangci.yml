version: "2"

run:
  # e2e/*.go is gated behind the "e2e" build tag (see e2e/main_test.go) so it
  # stays invisible to plain `go build`/`go test`; list the tag here so
  # golangci-lint still sees and lints those files.
  build-tags:
    - e2e

linters:
  # Default linters (errcheck, govet, ineffassign, staticcheck, unused) are
  # enabled automatically. We add revive for style checks and gosec for
  # security scanning.
  enable:
    - revive
    - errorlint
    - gosec
  settings:
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        # package-comments requires a doc comment in every file; Go convention
        # requires it in only one file per package (root.go in our case).
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ChristophBe/cuttings

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
