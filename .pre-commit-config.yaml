repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: go fmt
      - id: go-vet
        name: go vet
        # This hook runs `go vet` on explicit per-file lists rather than
        # package paths. Every file in e2e/ carries "//go:build e2e" and no
        # -tags flag is passed here, so go vet errors ("build constraints
        # exclude all Go files") instead of skipping them the way `go build
        # ./...`/`go test ./...` do. e2e/ is already vetted (via govet) by
        # the golangci-lint hook below, which has build-tags: [e2e] set in
        # .golangci.yml.
        exclude: ^e2e/
      - id: go-build
        name: go build

  - repo: local
    hooks:
      - id: go-test
        name: go test
        language: system
        entry: go test ./...
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        pass_filenames: false
        types: [go]
