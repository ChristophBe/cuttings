repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: go fmt
      - id: go-vet
        name: go vet
      - id: go-build
        name: go build

  - repo: local
    hooks:
      - id: go-test
        name: go test
        language: system
        entry: go test ./...
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: golangci-lint run
        pass_filenames: false
        types: [go]
